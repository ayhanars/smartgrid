# XcodeGen project definition. Run `xcodegen generate` in this directory to
# produce LittleScreen.xcodeproj (the .xcodeproj is deliberately not committed).
name: LittleScreen
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  LittleScreen:
    type: application
    platform: iOS
    sources:
      - path: LittleScreen
    info:
      path: LittleScreen/Info.plist
      properties:
        CFBundleDisplayName: LittleScreen
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        NSFaceIDUsageDescription: "LittleScreen can use Face ID so parents can open the parent area without typing the PIN."
        ITSAppUsesNonExemptEncryption: false
        # Child safety: no document sharing, no URL schemes, no browser.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.littlescreen
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LittleScreenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LittleScreenTests
    dependencies:
      - target: LittleScreen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  LittleScreen:
    build:
      targets:
        LittleScreen: all
        LittleScreenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LittleScreenTests
