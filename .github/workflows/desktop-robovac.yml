name: Desktop Robovac

on:
  push:
    paths:
      - "desktop-robovac/**"
      - ".github/workflows/desktop-robovac.yml"
  pull_request:
    paths:
      - "desktop-robovac/**"
      - ".github/workflows/desktop-robovac.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-robovac
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Assemble app bundle
        run: Scripts/make-app.sh

      - name: Smoke test the overlay (screenshot + window diagnostics)
        run: |
          mkdir -p smoke
          echo "hello" > "$HOME/Desktop/Robovac Probe.txt"
          sleep 2
          echo "===== finder icon positions ====="
          osascript -e 'tell application "Finder" to get {name, desktop position} of every item of desktop' || echo "osascript failed"
          osascript -e 'tell application "Finder" to get bounds of window of desktop' || true
          ROBOVAC_SMOKE_TEST=1 ./build/DesktopRobovac.app/Contents/MacOS/DesktopRobovac > smoke/app.log 2>&1 &
          APP_PID=$!
          sleep 7
          screencapture -x -t png smoke/desktop.png || echo "screencapture failed"
          sleep 10
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          echo "===== app log ====="
          cat smoke/app.log
          if [ -f smoke/desktop.png ]; then
            sips -Z 1100 smoke/desktop.png --out smoke/desktop-small.png >/dev/null
            echo "===== screenshot base64 begin ====="
            base64 -b 76 -i smoke/desktop-small.png
            echo "===== screenshot base64 end ====="
          fi

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: desktop-robovac/smoke

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: DesktopRobovac.app
          path: desktop-robovac/build/DesktopRobovac.app
