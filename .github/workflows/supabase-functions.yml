name: Deploy Supabase Edge Functions

# Pushes the `claude` Edge Function whenever it changes on main. Needs two
# repo secrets: SUPABASE_ACCESS_TOKEN (Account → Access Tokens) and
# SUPABASE_PROJECT_REF (the id in your project's URL). Skips quietly when
# they are not set, so forks without a Supabase project still build.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not set; skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: latest

      - name: Deploy functions
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy claude --project-ref "$SUPABASE_PROJECT_REF"
