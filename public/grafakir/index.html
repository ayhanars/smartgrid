<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafakir</title>
<meta name="description" content="Grafakir — karikatür çizgisinde su altı kasabası, balıklar, sazlıklar, kumda eski bir televizyon ve ziyaretçi sayan şehir tabelası">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Comic+Neue:wght@700&display=swap">
<style>
/* Layout: a single full-viewport canvas; everything (sky, sea, sand, sign, TV, fish) is drawn in the cartoon style. */
:root{
  --sky:#d7e6ff; --sea-top:#86aef0; --sea-bottom:#3f6fd6; --sand:#e8b88c; --sand-dark:#c98a5a;
  --ink:#1a1a1a; --sign:#2457b8; --paper:#ffffff;
  --font-balloon:"Comic Neue","Comic Sans MS","Chalkboard SE",sans-serif;
  --font-sign:"Boogaloo","Arial Rounded MT Bold","Arial Black",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea-bottom);color:var(--ink);font-family:var(--font-balloon)}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

</head>
<body>
<canvas id="sea" aria-label="Grafakir: karikatür su altı kasabası animasyonu" role="img"></canvas>
<span class="sr" id="counter-sr">Grafakir</span>

<script>
(() => {
'use strict';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TS = reduced ? 0.3 : 1;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(11);

/* ---------- visitor counter ---------- */
const BASE = 48213;
let visitors = null;
async function countVisit(){
  const skey = 'grafakir_counted', lkey = 'grafakir_count';
  let already = false;
  try { already = sessionStorage.getItem(skey) === '1'; } catch (e) {}
  let n = null;
  try {
    const r = await fetch('https://api.counterapi.dev/v1/grafakir-site/ziyaretci/' + (already ? '' : 'up'), { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (typeof j.count === 'number') n = j.count; }
  } catch (e) {}
  if (n == null) {
    try {
      let c = parseInt(localStorage.getItem(lkey) || '0', 10) || 0;
      if (!already) { c++; localStorage.setItem(lkey, String(c)); }
      n = BASE + c;
    } catch (e) { n = BASE + 1; }
  }
  try { sessionStorage.setItem(skey, '1'); } catch (e) {}
  visitors = n;
  const sr = document.getElementById('counter-sr');
  if (sr) sr.textContent = 'Grafakir. Ziyaretçi sayısı: ' + n;
}

/* ---------- canvas ---------- */
const cv = document.getElementById('sea');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, U = 1, mx = .5, my = .5, px = 0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = W < 600 ? .62 : W < 900 ? .8 : 1;
}
window.addEventListener('resize', resize); resize();
window.addEventListener('pointermove', e => { mx = e.clientX / W; my = e.clientY / H; });

const skyH = () => H * .17;
const sandY = () => H * .80;

/* ---------- static (TV snow) ---------- */
const snow = document.createElement('canvas'); snow.width = 48; snow.height = 36;
const sctx = snow.getContext('2d'); const simg = sctx.createImageData(48, 36);
let lastSnow = 0;
function updateSnow(now){
  if (now - lastSnow < (reduced ? 250 : 70)) return; lastSnow = now;
  const d = simg.data; for (let i = 0; i < d.length; i += 4) { const v = 40 + (Math.random() * 215) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  sctx.putImageData(simg, 0, 0);
}

/* ---------- world ---------- */
const ink = '#1a1a1a';
const bubbles = [];
function spawnBubble(x, y, r){ bubbles.push({ x, y, r, vy: rnd(14, 30) * (r / 6 + .5), ph: rnd(0, TAU), light: Math.random() < .6 }); }
const dots = Array.from({ length: 40 }, () => ({ x: R(), y: .2 + R() * .58, r: 3 + R() * 14, light: R() < .5 }));
const clouds = [{ x: .08, y: .45, s: 1 }, { x: .88, y: .35, s: 1.2 }];
const birds = [{ x: .18, y: .3 }, { x: .22, y: .5 }, { x: .76, y: .25 }, { x: .8, y: .45 }, { x: .73, y: .55 }];

const buildings = [
  { x: .30, w: 70, h: 110, t: 'blok' }, { x: .38, w: 54, h: 160, t: 'kule' }, { x: .47, w: 90, h: 95, t: 'blok' },
  { x: .58, w: 60, h: 135, t: 'kule' }, { x: .66, w: 80, h: 90, t: 'blok' },
];
const reeds = [];
for (let i = 0; i < 18; i++) { const x = R(); if ((x > .70 && x < .90) || x < .18) continue; reeds.push({ x, h: 50 + R() * 110, ph: R() * TAU, sp: .6 + R() * .6, green: R() < .3, front: R() < .5 }); }

const fish = [];
const colors = [['#b56ad6', '#8a44ad'], ['#f0a04b', '#c77a2a'], ['#6fc46a', '#459a46'], ['#f26d7d', '#c54a5c'], ['#5fb8e8', '#3a8dbd'], ['#f3cf4a', '#c9a62c']];
function mkFish(o){
  const [c1, c2] = pick(colors);
  const f = Object.assign({ x: rnd(.05, .95), y: rnd(.26, .68), s: rnd(.6, 1), dir: Math.random() < .5 ? -1 : 1, v: rnd(14, 34), ph: rnd(0, TAU),
    c1, c2, mood: pick(['normal', 'worried', 'happy']), msg: null, msgT: 0, burst: 0, say(t, s){ this.msg = t; this.msgT = s; } }, o);
  fish.push(f); return f;
}
for (let i = 0; i < 5; i++) mkFish({});
const grumpy = mkFish({ x: .35, y: .4, s: 1.05, c1: '#b56ad6', c2: '#8a44ad', mood: 'worried', dir: 1, v: 16 });
const guide = mkFish({ x: .72, y: .3, s: 1.15, c1: '#f0a04b', c2: '#c77a2a', mood: 'happy', dir: -1, v: 18 });
const viewer = { x: .70, y: 0, s: .55, dir: -1, c1: '#5fb8e8', c2: '#3a8dbd', mood: 'normal', ph: 1, msg: null, msgT: 0, burst: 0, static: true, say(t, s){ this.msg = t; this.msgT = s; } };
const crab = { x: .14, dir: 1 };
const tv = { x: .78, wob: 0, flash: 0 };

const chatter = ['TELEVİZYONDA YİNE KARINCA VAR.', 'KUMANDAYI GÖREN OLDU MU?', 'TABELAYI OKUDUN MU?', 'SAZLIKLAR BUGÜN KEYİFLİ.', 'YENGEÇ YİNE SİNİRLİ.', 'BURASI GRAFAKİR!'];
setTimeout(() => grumpy.say('AYYY\nYİNE Mİ SEN?', 4), 1500);
setTimeout(() => guide.say('YENİ GELMEDİK,\nGERİ GELDİK..!', 4.5), 4200);
setTimeout(() => { if (visitors != null) guide.say('HOŞ GELDİN,\n' + visitors + '. ZİYARETÇİ!', 4.5); }, 10000);
setInterval(() => { const f = pick([guide, grumpy, viewer]); if (!f.msg && Math.random() < .7) f.say(f === viewer ? 'ŞŞŞT, YAYIN BAŞLIYOR.' : pick(chatter), 4); }, 11000);

cv.addEventListener('pointerdown', e => {
  const X = e.clientX, Y = e.clientY;
  for (let i = 0; i < 8; i++) spawnBubble(X + rnd(-8, 8), Y + rnd(-8, 8), rnd(3, 9));
  const tx = tv.x * W, ty = sandY() - 48 * U;
  if (Math.abs(X - tx) < 90 * U && Math.abs(Y - ty) < 70 * U) { tv.wob = 1; tv.flash = 1.2; viewer.say('BAK, GRAFAKİR ÇIKTI!', 3); return; }
  let best = null, bd = 1e9;
  for (const f of fish) { const d = Math.hypot(f.x * W - X, f.y * H - Y); if (d < bd) { bd = d; best = f; } }
  if (best && bd < 120 * U) { best.burst = 1.2; best.dir = best.x * W < X ? -1 : 1; }
});

/* ---------- cartoon helpers ---------- */
function outline(w){ ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = w; ctx.strokeStyle = ink; ctx.stroke(); }
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function rrect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// googly eye pair: two white circles that touch, small pupils looking the same way
function eyes(x, y, r, lx, ly, brow){
  const d = r * .95;
  for (const sx of [-1, 1]) { ctx.fillStyle = '#fff'; circle(x + sx * d, y + (sx > 0 ? -r * .1 : 0), r); ctx.fill(); outline(3.2); }
  for (const sx of [-1, 1]) { ctx.fillStyle = ink; circle(x + sx * d + lx * r * .45, y + (sx > 0 ? -r * .1 : 0) + ly * r * .45, r * .32); ctx.fill(); }
  if (brow === 'worried') { ctx.beginPath(); ctx.moveTo(x - d - r, y - r * 1.2); ctx.quadraticCurveTo(x - d, y - r * 1.7, x - d + r * .5, y - r * 1.25); ctx.moveTo(x + d - r * .5, y - r * 1.35); ctx.quadraticCurveTo(x + d, y - r * 1.8, x + d + r, y - r * 1.25); outline(3); }
  if (brow === 'angry') { ctx.beginPath(); ctx.moveTo(x - d - r * .8, y - r * 1.6); ctx.lineTo(x - d + r * .4, y - r * 1.15); ctx.moveTo(x + d + r * .8, y - r * 1.7); ctx.lineTo(x + d - r * .4, y - r * 1.25); outline(3); }
}
function speckle(x0, y0, w, h, n, seed, light, dark){
  const r = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const x = x0 + r() * w, y = y0 + r() * h, k = r();
    if (k < .35) { ctx.fillStyle = dark; circle(x, y, 2 + r() * 5); ctx.fill(); }
    else if (k < .6) { ctx.strokeStyle = dark; ctx.lineWidth = 2; circle(x, y, 4 + r() * 6); ctx.stroke(); }
    else { ctx.strokeStyle = light; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 5, y - 6); ctx.stroke(); }
  }
}
function balloon(text, x, y, tailDown){
  const lines = text.split('\n'), fs = 17 * U + 3;
  ctx.font = `700 ${fs}px "Comic Neue", "Comic Sans MS", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = Math.max(...lines.map(l => ctx.measureText(l).width)) + fs * 1.8, th = lines.length * fs * 1.25 + fs * 1.1;
  const left = clamp(x - tw / 2, 10, W - tw - 10), top = tailDown ? y - th - 26 * U : y + 26 * U;
  const tx = clamp(x, left + 24, left + tw - 24);
  ctx.fillStyle = '#fff'; rrect(left, top, tw, th, th / 2.2); ctx.fill(); outline(4);
  ctx.beginPath();
  if (tailDown) { ctx.moveTo(tx - 12, top + th - 2); ctx.lineTo(tx + 10, top + th - 2); ctx.lineTo(tx - 4, y - 4); }
  else { ctx.moveTo(tx - 12, top + 2); ctx.lineTo(tx + 10, top + 2); ctx.lineTo(tx - 4, y + 4); }
  ctx.closePath(); ctx.fill(); outline(4);
  ctx.fillStyle = '#fff'; ctx.fillRect(tx - 11, tailDown ? top + th - 5 : top, 20, 6);
  ctx.fillStyle = ink; lines.forEach((l, i) => ctx.fillText(l, left + tw / 2, top + fs * 1.05 + i * fs * 1.25));
}

/* ---------- scene parts ---------- */
function drawSky(t){
  const g = ctx.createLinearGradient(0, 0, 0, skyH() + 40); g.addColorStop(0, '#c9dcff'); g.addColorStop(1, '#e6f0ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, skyH() + 60);
  for (const c of clouds) {
    const x = c.x * W + px * 10, y = c.y * skyH(), s = c.s * U * 1.1;
    const parts = [[0, 0, 26], [28, -8, 20], [-26, 4, 18], [10, -18, 18], [48, 4, 14]];
    ctx.fillStyle = '#fff'; for (const [dx, dy, r] of parts) { circle(x + dx * s, y + dy * s, r * s); ctx.fill(); outline(4); }
    for (const [dx, dy, r] of parts) { circle(x + dx * s, y + dy * s, r * s - 1); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 44 * s, y + 10 * s, 110 * s, 12 * s); ctx.beginPath(); ctx.moveTo(x - 44 * s, y + 22 * s); ctx.lineTo(x + 66 * s, y + 22 * s); outline(4);
  }
  for (const b of birds) {
    const x = b.x * W, y = b.y * skyH() + Math.sin(t * 2 + b.x * 20) * 2, s = 7 * U;
    ctx.beginPath(); ctx.moveTo(x - s, y - s * .3); ctx.quadraticCurveTo(x - s * .4, y + s * .4, x, y); ctx.quadraticCurveTo(x + s * .4, y + s * .4, x + s, y - s * .3); outline(2.5);
  }
}
function seaTop(x, t){ return skyH() + Math.sin(x * .012 + t * .8) * 9 + Math.sin(x * .03 - t * 1.1) * 4; }
function drawSea(t){
  const g = ctx.createLinearGradient(0, skyH(), 0, H); g.addColorStop(0, '#8db3f2'); g.addColorStop(.5, '#4f82e0'); g.addColorStop(1, '#3762c9');
  ctx.beginPath(); ctx.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 20; x += 16) ctx.lineTo(x, seaTop(x, t));
  ctx.lineTo(W + 10, H + 10); ctx.closePath(); ctx.fillStyle = g; ctx.fill(); outline(5);
  // flat texture circles
  for (const d of dots) { ctx.fillStyle = d.light ? 'rgba(255,255,255,.22)' : 'rgba(20,60,170,.22)'; circle(d.x * W + px * 6, skyH() + d.y * H, d.r * U); ctx.fill(); }
}
function drawBuildings(t){
  const g = sandY() + 24;
  for (const b of buildings) {
    const x = b.x * W + px * 14, w = b.w * U, h = b.h * U;
    ctx.save(); ctx.translate(x, g); ctx.rotate((b.x - .48) * .06);
    ctx.fillStyle = '#5f8ddc';
    if (b.t === 'blok') { rrect(-w / 2, -h, w, h, 6); ctx.fill(); ctx.fillStyle = '#4b74c4'; rrect(-w / 2 - 6, -h - 10, w + 12, 12, 4); ctx.fill(); ctx.strokeStyle = '#223a7a'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke(); rrect(-w / 2, -h, w, h, 6); ctx.stroke(); }
    else { rrect(-w / 2, -h, w, h, 6); ctx.fill(); ctx.strokeStyle = '#223a7a'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke(); ctx.fillStyle = '#4b74c4'; ctx.beginPath(); ctx.arc(0, -h, w / 2 + 4, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#2d4f9e';
    const cols = b.t === 'blok' ? 3 : 2, rows = Math.max(2, Math.round(h / (34 * U)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const lit = Math.sin(t * .4 + r * 3 + c * 7 + b.x * 50) > .6;
      ctx.fillStyle = lit ? '#ffe28a' : '#2d4f9e';
      rrect(-w / 2 + w * (.14 + c * .72 / cols) + 2, -h + 14 + r * (h - 20) / rows, w * .72 / cols - 8, (h - 20) / rows - 10, 3); ctx.fill();
    }
    ctx.restore();
  }
}
function drawReed(r, t, front){
  const x = r.x * W + px * (front ? 22 : 8), base = sandY() + (front ? 14 : 4), h = r.h * U;
  const col = r.green ? ['#5a7d3a', '#9cc06a'] : ['#b5743f', '#e9b88c'];
  for (let k = 0; k < 2; k++) {
    ctx.beginPath(); ctx.moveTo(x + k * 8, base);
    for (let i = 1; i <= 8; i++) {
      const p = i / 8, sway = Math.sin(t * r.sp + r.ph + p * 2) * 12 * p * p;
      ctx.lineTo(x + k * 8 + sway + (i % 2 ? -7 : 7) * p, base - h * p * (k ? .8 : 1));
    }
    ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.strokeStyle = col[0]; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = col[1]; for (let i = 1; i <= 4; i++) { const p = i / 4.5, sway = Math.sin(t * r.sp + r.ph + p * 2) * 12 * p * p; circle(x + k * 8 + sway + (i % 2 ? 8 : -8) * p, base - h * p * (k ? .8 : 1), 2.5); ctx.fill(); }
  }
}
function drawSand(){
  const g = sandY();
  ctx.fillStyle = '#e8b88c'; ctx.beginPath(); ctx.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 20; x += 18) ctx.lineTo(x, g + Math.sin(x * .018) * 7 + Math.sin(x * .05 + 2) * 3);
  ctx.lineTo(W + 10, H + 10); ctx.closePath(); ctx.fill(); outline(5);
  ctx.save(); ctx.clip(); speckle(0, g + 8, W, H - g, Math.round(W / 14), 5, 'rgba(255,255,255,.75)', '#c98a5a'); ctx.restore();
  // half-buried tire on the right
  const tx = W * .93, ty = g + 18;
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(-.25);
  ctx.fillStyle = '#2b2b2b'; circle(0, 0, 36 * U); ctx.fill(); outline(4);
  ctx.fillStyle = '#e8b88c'; circle(0, 0, 16 * U); ctx.fill(); outline(4);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 3; for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 28 * U, Math.sin(a) * 28 * U); ctx.lineTo(Math.cos(a) * 36 * U, Math.sin(a) * 36 * U); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#e8b88c'; ctx.beginPath(); ctx.moveTo(tx - 50 * U, ty + 8); for (let x = tx - 50 * U; x <= tx + 50 * U; x += 10) ctx.lineTo(x, ty + 8 + Math.sin(x * .1) * 3); ctx.lineTo(tx + 50 * U, H); ctx.lineTo(tx - 50 * U, H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); for (let x = tx - 50 * U; x <= tx + 50 * U; x += 10) ctx.lineTo(x, ty + 8 + Math.sin(x * .1) * 3); outline(4);
}
function drawSign(t){
  const pw = 190 * U, ph = 86 * U, x = Math.max(W * .12, pw / 2 + 16) + px * 16, g = sandY() + 6;
  ctx.save(); ctx.translate(x, g); ctx.rotate(-.05 + Math.sin(t * .6) * .01);
  ctx.fillStyle = '#b8bcc4'; rrect(-6 * U, -ph - 58 * U, 12 * U, ph + 66 * U, 4); ctx.fill(); outline(4);
  ctx.translate(0, -ph - 52 * U);
  ctx.fillStyle = '#fff'; rrect(-pw / 2, -ph / 2, pw, ph, 8); ctx.fill(); outline(4);
  ctx.fillStyle = '#2457b8'; rrect(-pw / 2 + 6 * U, -ph / 2 + 6 * U, pw - 12 * U, ph - 12 * U, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 38 * U; ctx.font = `${fs}px Boogaloo, "Arial Rounded MT Bold", sans-serif`; while (ctx.measureText('GRAFAKİR').width > pw * .84 && fs > 10) { fs -= 1; ctx.font = `${fs}px Boogaloo, "Arial Rounded MT Bold", sans-serif`; } ctx.fillText('GRAFAKİR', 0, -ph * .2);
  ctx.font = `${15 * U}px Boogaloo, sans-serif`; ctx.textAlign = 'left'; ctx.fillText('NÜFUS', -pw * .42, ph * .24);
  const digits = (visitors == null ? '------' : String(visitors).padStart(6, '0')).slice(-6);
  const dw = 14 * U, dh = 22 * U, sx = pw * .42 - 6 * (dw + 2);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = '#1a1a1a'; rrect(sx + i * (dw + 2), ph * .24 - dh / 2, dw, dh, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `${17 * U}px Boogaloo, monospace`; ctx.fillText(digits[i], sx + i * (dw + 2) + dw / 2, ph * .24 + 1);
  }
  ctx.restore();
}
function drawTV(t){
  const x = tv.x * W + px * 20, g = sandY() + 8, w = 120 * U, h = 90 * U;
  const wob = tv.wob > 0 ? Math.sin(tv.wob * 20) * .06 * tv.wob : 0;
  ctx.save(); ctx.translate(x, g); ctx.rotate(-.06 + wob);
  // feet & antenna
  ctx.fillStyle = '#5a3a22'; rrect(-w * .38, -8, 14 * U, 12 * U, 3); ctx.fill(); outline(3); rrect(w * .24, -8, 14 * U, 12 * U, 3); ctx.fill(); outline(3);
  ctx.beginPath(); ctx.moveTo(w * .05, -h - 4); ctx.lineTo(-w * .18, -h - 46 * U); ctx.moveTo(w * .05, -h - 4); ctx.lineTo(w * .3, -h - 50 * U); outline(4);
  ctx.fillStyle = '#ddd'; circle(-w * .18, -h - 46 * U, 4 * U); ctx.fill(); outline(3); circle(w * .3, -h - 50 * U, 4 * U); ctx.fill(); outline(3);
  // body
  ctx.fillStyle = '#d99a5b'; rrect(-w / 2, -h - 6, w, h + 2, 10 * U); ctx.fill(); outline(4.5);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; rrect(-w / 2 + 4, -h * .3, w - 8, h * .22, 6); ctx.fill();
  // screen
  const sw = w * .64, sh = h * .68, sx = -w / 2 + w * .07, sy = -h + h * .1;
  ctx.save(); rrect(sx, sy, sw, sh, 9 * U); ctx.clip();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(snow, sx, sy, sw, sh); ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let yy = sy; yy < sy + sh; yy += 4) ctx.fillRect(sx, yy, sw, 2);
  if (tv.flash > 0 || Math.sin(t * .7) > .93) { ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${17 * U}px Boogaloo, sans-serif`; ctx.fillText('GRAFAKİR', sx + sw / 2, sy + sh / 2); }
  ctx.restore(); rrect(sx, sy, sw, sh, 9 * U); outline(4);
  // knobs & speaker
  ctx.fillStyle = '#3b2a1e'; circle(w * .33, -h * .72, 8 * U); ctx.fill(); outline(3); circle(w * .33, -h * .42, 8 * U); ctx.fill(); outline(3);
  ctx.beginPath(); ctx.moveTo(w * .33, -h * .72); ctx.lineTo(w * .33 + 6 * U, -h * .72 - 4 * U); ctx.moveTo(w * .33, -h * .42); ctx.lineTo(w * .33 - 6 * U, -h * .42 - 4 * U); ctx.strokeStyle = '#f2e3c6'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = ink; ctx.lineWidth = 2.5; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(w * .26, -h * .25 + i * 5 * U); ctx.lineTo(w * .4, -h * .25 + i * 5 * U); ctx.stroke(); }
  ctx.restore();
  if (tv.flash > 0) { for (let i = 0; i < 2; i++) spawnBubble(x + rnd(-20, 20), g - h, rnd(3, 6)); }
  // little fish watching the TV, sitting on the sand in front of it
  viewer.x = tv.x + (26 * U) / W + px * 20 / W; viewer.y = (g - 16 * U) / H;
  drawFish(viewer, t, true);
}
function drawFish(f, t, still){
  const s = f.s * U, bob = still ? Math.sin(t * 2 + f.ph) * 2 : Math.sin(t * 1.4 + f.ph) * 5;
  ctx.save(); ctx.translate(f.x * W, f.y * H + bob); ctx.scale(f.dir * s, s);
  const wob = Math.sin(t * 7 + f.ph) * (f.burst > 0 ? .5 : .22);
  // tail
  ctx.fillStyle = f.c1; ctx.beginPath(); ctx.moveTo(-24, -4);
  ctx.quadraticCurveTo(-36, -8 + wob * 10, -50, -24 + wob * 16); ctx.quadraticCurveTo(-42, -4, -42, 0 + wob * 6); ctx.quadraticCurveTo(-42, 4, -50, 24 + wob * 16); ctx.quadraticCurveTo(-36, 8 + wob * 10, -24, 4); ctx.closePath(); ctx.fill(); outline(4);
  // dorsal spikes
  ctx.beginPath(); ctx.moveTo(-12, -22); ctx.lineTo(-6, -36); ctx.lineTo(0, -24); ctx.lineTo(6, -34); ctx.lineTo(10, -22); ctx.closePath(); ctx.fill(); outline(4);
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 25, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = f.c2; ctx.beginPath(); ctx.ellipse(-4, 14, 34, 16, 0, 0, TAU); ctx.fill(); ctx.restore(); outline(4);
  // pectoral fin
  ctx.fillStyle = f.c2; ctx.beginPath(); ctx.moveTo(-6, 8); ctx.quadraticCurveTo(-18, 22 + wob * 6, 4, 20); ctx.closePath(); ctx.fill(); outline(3.5);
  // lips
  ctx.fillStyle = '#f4b78d'; ctx.beginPath(); ctx.ellipse(30, -2, 11, 7, 0, 0, TAU); ctx.fill(); outline(3.5);
  ctx.beginPath(); ctx.ellipse(30, 8, 10, 6, 0, 0, TAU); ctx.fill(); outline(3.5);
  ctx.beginPath(); ctx.moveTo(22, 3); ctx.lineTo(38, 3); outline(2.5);
  // eyes above the head
  eyes(8, -24, 10, f.dir > 0 ? .9 : .9, .2, f.mood === 'worried' ? 'worried' : null);
  if (f.mood === 'happy') { ctx.beginPath(); ctx.arc(20, 4, 9, .2, 1.4); outline(3); }
  ctx.restore();
  if (f.msg && f.msgT > 0) balloon(f.msg, f.x * W, f.y * H - 44 * s, true);
}
function drawCrab(t){
  const x = crab.x * W, y = sandY() + 24, s = .8 * U;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let i = 0; i < 3; i++) for (const d of [-1, 1]) { const a = Math.sin(t * 9 + i) * 4; ctx.beginPath(); ctx.moveTo(d * 14, 2 + i * 5); ctx.lineTo(d * (30 + i * 3), 8 + i * 5 + a); ctx.lineTo(d * (34 + i * 3), 18 + i * 3); outline(4); }
  ctx.fillStyle = '#e8604f'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 17, 0, 0, TAU); ctx.fill(); outline(4);
  const snap = Math.abs(Math.sin(t * 2.2)) * .5;
  for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 30, -8); ctx.rotate(d * (-.4 + snap)); ctx.fillStyle = '#e8604f'; circle(0, 0, 11); ctx.fill(); outline(4); ctx.fillStyle = '#e8b88c'; ctx.beginPath(); ctx.moveTo(d * 3, -7); ctx.lineTo(d * 13, -2); ctx.lineTo(d * 3, 3); ctx.closePath(); ctx.fill(); ctx.restore(); }
  eyes(0, -24, 7, 0, -.5, 'angry');
  ctx.beginPath(); ctx.moveTo(-7, 7); ctx.quadraticCurveTo(0, 2, 7, 7); outline(3);
  ctx.restore();
}
function drawBubbles(dt){
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= b.vy * dt; b.x += Math.sin(b.y * .03 + b.ph) * .4;
    if (b.y < seaTop(b.x, 0) + 6) { bubbles.splice(i, 1); continue; }
    ctx.fillStyle = b.light ? 'rgba(255,255,255,.5)' : 'rgba(20,60,170,.3)'; circle(b.x, b.y, b.r * U); ctx.fill();
  }
  if (bubbles.length < 30 && Math.random() < .05 * TS) spawnBubble(rnd(0, W), sandY() + rnd(0, 20), rnd(3, 8));
}

/* ---------- update & loop ---------- */
function update(dt, t){
  for (const f of fish) {
    f.x += f.dir * f.v * (f.burst > 0 ? 3.5 : 1) * dt / W;
    f.y = clamp(f.y + Math.sin(t * .35 + f.ph) * .0004, .24, .7);
    if (f.x > 1.08) { f.x = 1.08; f.dir = -1; } if (f.x < -.08) { f.x = -.08; f.dir = 1; }
    if (Math.random() < .0015) f.dir *= -1;
    f.burst -= dt;
    if (f.msg) { f.msgT -= dt; if (f.msgT <= 0) f.msg = null; }
    if (Math.random() < .003 * TS) spawnBubble(f.x * W + f.dir * 34 * f.s * U, f.y * H, rnd(3, 5));
  }
  if (viewer.msg) { viewer.msgT -= dt; if (viewer.msgT <= 0) viewer.msg = null; }
  crab.x += crab.dir * .025 * dt; if (crab.x > .24 || crab.x < .05) crab.dir *= -1;
  tv.wob = Math.max(0, tv.wob - dt * 1.2); tv.flash = Math.max(0, tv.flash - dt);
  px += ((mx - .5) * -1 - px) * .05;
}
let last = performance.now(), T = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000) * TS; last = now; T += dt;
  updateSnow(now); update(dt, T);
  drawSky(T); drawSea(T);
  drawBuildings(T);
  for (const r of reeds) if (!r.front) drawReed(r, T, false);
  for (const f of fish) if (f.s < .8) drawFish(f, T);
  drawSand();
  drawSign(T); drawTV(T); drawCrab(T);
  for (const r of reeds) if (r.front) drawReed(r, T, true);
  for (const f of fish) if (f.s >= .8) drawFish(f, T);
  drawBubbles(dt);
}
requestAnimationFrame(frame);
countVisit();
})();
</script>
